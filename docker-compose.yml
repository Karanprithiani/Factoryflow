# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: factoryflow
      POSTGRES_PASSWORD: factoryflow
      POSTGRES_DB: factoryflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata:
